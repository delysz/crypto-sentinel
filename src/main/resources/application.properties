spring.application.name=cryptoCentinela

# 🗄️ Base de datos local H2 integrada (Para producción en Render)
spring.datasource.url=jdbc:h2:file:/app/data/sentineldb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 🛡️ Seguridad panel de Delysz
spring.security.user.name=${SPRING_SECURITY_USER_NAME:delysz}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:admin123}

# 🛰️ Sentinel configuraciones
sentinel.crypto.ids=bitcoin,ethereum,chainlink,aave,polkadot,solana
sentinel.alert.threshold=-0.05

# 🤖 Telegram Bot
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.chat.id=${TELEGRAM_CHAT_ID}

# 🔌 Puerto adaptativo para Render
server.port=${PORT:8080}