spring.application.name=cryptoCentinela

# ?? Base de datos H2 ????????????????????????????????????????
spring.datasource.url=jdbc:h2:file:./data/sentineldb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola H2 ? activar solo en local (H2_CONSOLE=true en IntelliJ)
spring.h2.console.enabled=${H2_CONSOLE:false}
spring.h2.console.settings.web-allow-others=false

# ?? Sentinel ?????????????????????????????????????????????????
sentinel.crypto.ids=bitcoin,ethereum,chainlink,aave,polkadot,solana
sentinel.alert.threshold=-0.05

# ?? Telegram ?????????????????????????????????????????????????
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.chat.id=${TELEGRAM_CHAT_ID}

# ?? Servidor ?????????????????????????????????????????????????
server.port=${PORT:8080}